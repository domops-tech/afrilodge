name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  DATABASE_URL: "postgresql://sejours:sejours@localhost:5432/sejours?schema=public"
  AUTH_SECRET: "ci-secret-not-for-production"
  PAYMENT_WEBHOOK_SECRET: "ci-secret-not-for-production"
  SMS_PROVIDER: "console"
  EMAIL_PROVIDER: "console"
  PAYMENT_PROVIDER: "simulated"
  STORAGE_ENDPOINT: "http://localhost:9000"
  STORAGE_REGION: "us-east-1"
  STORAGE_BUCKET: "sejours-photos"
  STORAGE_ACCESS_KEY_ID: "sejours"
  STORAGE_SECRET_ACCESS_KEY: "sejours-secret"
  STORAGE_FORCE_PATH_STYLE: "true"

jobs:
  checks:
    name: Lint, typecheck, unit tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: sejours
          POSTGRES_PASSWORD: sejours
          POSTGRES_DB: sejours
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U sejours -d sejours"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npx prisma migrate deploy
      - run: npm test

  e2e:
    name: End-to-end (Playwright)
    runs-on: ubuntu-latest
    needs: checks
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: sejours
          POSTGRES_PASSWORD: sejours
          POSTGRES_DB: sejours
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U sejours -d sejours"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # MinIO n'accepte pas de commande personnalisée via `services:` (pas
      # de champ `command` dans cette syntaxe) — démarré manuellement.
      - name: Start MinIO
        run: |
          docker run -d --name minio -p 9000:9000 -p 9001:9001 \
            -e MINIO_ROOT_USER=sejours -e MINIO_ROOT_PASSWORD=sejours-secret \
            minio/minio server /data --console-address ":9001"
          for i in $(seq 1 20); do
            curl -sf http://localhost:9000/minio/health/ready && break
            sleep 2
          done
      - run: npx prisma migrate deploy
      - run: npm run storage:setup
      - run: npx prisma db seed
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
