# Déploiement — develop -> staging (test.ayostay.com), main -> production
# (ayostay.com, après approbation : Settings > Environments > production >
# Required reviewers). Se déclenche une fois le workflow "CI" réussi.
#
# Secrets PAR environnement GitHub (staging et production) :
#   DEPLOY_HOST (91.90.83.31 | 91.90.83.30), DEPLOY_USER (= deploy), DEPLOY_SSH_KEY.
# Variable PAR environnement : PUBLIC_HOST (test.ayostay.com | ayostay.com).
#
# L'image est construite EN CI, une fois par environnement : NEXT_PUBLIC_IMAGES_CDN_URL
# est figée au build (Next.js), donc une image de staging ne peut pas être
# promue telle quelle en production. Le serveur ne fait que `pull`.
# Prérequis serveur, une fois : docker login ghcr.io (token read:packages).
name: Deploy

on:
  workflow_run:
    workflows: ["CI"]
    branches: [develop, main]
    types: [completed]

jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    environment: ${{ github.event.workflow_run.head_branch == 'main' && 'production' || 'staging' }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}   # le commit testé, pas la tête de main
      - id: v
        run: |
          sha="${{ github.event.workflow_run.head_sha }}"
          env=${{ github.event.workflow_run.head_branch == 'main' && 'prod' || 'staging' }}
          echo "tag=${sha::12}-$env" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/${{ github.repository }}:${{ steps.v.outputs.tag }}
          cache-from: type=gha,scope=${{ steps.v.outputs.tag }}
          cache-to: type=gha,mode=max,scope=${{ steps.v.outputs.tag }}
          build-args: |
            NEXT_PUBLIC_IMAGES_CDN_URL=https://${{ vars.PUBLIC_HOST }}/media
      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.DEPLOY_SSH_KEY }}
      - run: |
          ssh -o StrictHostKeyChecking=accept-new \
            "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" '
            set -euo pipefail
            cd /srv/apps/ayostay
            # IMAGE_TAG vit dans .env : seul fichier lu par compose pour interpoler.
            grep -v "^IMAGE_TAG=" .env > .env.tmp || true
            echo "IMAGE_TAG=${{ steps.v.outputs.tag }}" >> .env.tmp
            mv .env.tmp .env
            docker compose pull app migrate
            docker compose run --rm migrate
            docker compose up -d app          # db et minio ne sont jamais recréés
            for i in $(seq 1 20); do
              [ "$(docker inspect -f "{{.State.Health.Status}}" ayostay-app 2>/dev/null || echo starting)" = healthy ] && exit 0
              sleep 3
            done
            echo "ayostay-app jamais healthy" >&2; docker compose logs --tail=50 app >&2; exit 1
          '

# Retour arrière (sans rebuild), sur le tag précédent visible dans GHCR :
#   ssh deploy@<hôte> 'cd /srv/apps/ayostay && sed -i "s/^IMAGE_TAG=.*/IMAGE_TAG=<tag précédent>/" .env && docker compose up -d app'
